version: '3.8'

services:
  # Base de données relationnelle Multi-Tenant (Admissions & RBAC)
  postgres:
    image: postgres:15-alpine
    container_name: saas_school_postgres
    restart: always
    environment:
      POSTGRES_USER: saas_admin
      POSTGRES_PASSWORD: saas_secure_password_2026
      POSTGRES_DB: saas_school_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_admissions_module.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_admin -d saas_school_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Gestionnaire de file d'attente (Webhooks Mobile Money, Emails & SMS)
  redis:
    image: redis:7-alpine
    container_name: saas_school_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Coffre-fort numérique local (Stockage S3 compatible pour pièces justificatives)
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: saas_school_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Backend API NestJS / TypeScript
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_school_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://saas_admin:saas_secure_password_2026@postgres:5432/saas_school_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_secure_password_2026
      S3_BUCKET_NAME: coffre-fort-documents
      JWT_SECRET: super_secret_jwt_key_saas_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
